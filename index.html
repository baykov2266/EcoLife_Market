<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLife Market | Био-Тек</title>
    <style>
        :root {
            --bg-color: #050a07;
            --glass-bg: rgba(20, 255, 100, 0.03);
            --glass-border: rgba(20, 255, 100, 0.15);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            /* Фоновые неоновые пятна */
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(16, 185, 129, 0.1), transparent 30%),
                radial-gradient(circle at 85% 70%, rgba(5, 150, 105, 0.1), transparent 30%);
        }

        /* Глассморфизм */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Навигация */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            text-shadow: 0 0 15px var(--accent-glow);
        }
        
        .logo span {
            color: var(--accent);
        }

        .badge {
            font-size: 0.85rem;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            background: rgba(16, 185, 129, 0.1);
        }

        /* Hero секция */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-content {
            animation: fadeInLeft 1s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* Интерактивный калькулятор-конфигуратор */
        .calculator {
            padding: 2.5rem;
            animation: fadeInRight 1s ease-out;
            position: relative;
        }

        .calculator::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .calc-title {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, .custom-select {
            width: 100%;
            padding: 1.2rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Чекбоксы (Опции) */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .checkbox-btn {
            position: relative;
            display: block;
            cursor: pointer;
        }

        .checkbox-btn input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkbox-content {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .checkbox-btn input:checked ~ .checkbox-content {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: inset 0 0 10px var(--accent-glow);
        }

        /* Блок итога */
        .result-panel {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-wrap {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .price-value {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            text-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        /* Анимации */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

        /* Мобильный Адаптив */
        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            h1 { font-size: 2.5rem; }
            .calculator { padding: 1.5rem; }
            .result-panel {
                flex-direction: column;
                gap: 1.5rem;
                text-align: center;
            }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">EcoLife<span>_</span>Market</div>
            <div class="badge">UI/UX Лаборатория</div>
        </header>

        <main class="hero">
            <div class="hero-content">
                <h1>Технологии чистого будущего.</h1>
                <p>Умная подписка на органические продукты и eco-friendly товары. Настройте свой персональный био-бокс за пару кликов.</p>
                
                <div style="display: flex; gap: 1rem; margin-top: 3rem;">
                    <div class="glass" style="padding: 1.2rem; flex: 1;">
                        <div style="color: var(--accent); font-size: 1.5rem; font-weight: bold; margin-bottom: 0.2rem;">100%</div>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">Биоразлагаемая упаковка</div>
                    </div>
                    <div class="glass" style="padding: 1.2rem; flex: 1;">
                        <div style="color: var(--accent); font-size: 1.5rem; font-weight: bold; margin-bottom: 0.2rem;">Zero</div>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">Углеродный след</div>
                    </div>
                </div>
            </div>

            <!-- Интерактивный Калькулятор -->
            <div class="calculator glass">
                <div class="calc-title">Конфигуратор Eco-Box</div>

                <div class="form-group">
                    <label>Объем корзины</label>
                    <select id="boxSize" onchange="calcPrice()">
                        <option value="2500">Базовый набор (5-7 позиций)</option>
                        <option value="4200">Оптимальный (10-12 позиций)</option>
                        <option value="6500">Премиум (Ультра-органика)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Интервал доставки</label>
                    <select id="deliveryFreq" onchange="calcPrice()">
                        <option value="1">Разово (без скидки)</option>
                        <option value="0.9">Раз в 2 недели (-10%)</option>
                        <option value="0.85">Каждую неделю (-15%)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Дополнительные опции</label>
                    <div class="options-grid">
                        <label class="checkbox-btn">
                            <input type="checkbox" id="optVegan" value="500" onchange="calcPrice()">
                            <div class="checkbox-content">Только Vegan</div>
                        </label>
                        <label class="checkbox-btn">
                            <input type="checkbox" id="optDetox" value="800" onchange="calcPrice()">
                            <div class="checkbox-content">Detox-соки</div>
                        </label>
                    </div>
                </div>

                <div class="result-panel">
                    <div class="price-wrap">
                        <span class="price-label">Итоговая стоимость</span>
                        <div class="price-value" id="totalPrice">2 500 ₽</div>
                    </div>
                    <button class="btn">Оформить</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        function calcPrice() {
            // Собираем значения
            const basePrice = parseInt(document.getElementById('boxSize').value);
            const multiplier = parseFloat(document.getElementById('deliveryFreq').value);
            
            let extras = 0;
            if (document.getElementById('optVegan').checked) extras += parseInt(document.getElementById('optVegan').value);
            if (document.getElementById('optDetox').checked) extras += parseInt(document.getElementById('optDetox').value);

            // Считаем итог
            const total = Math.round((basePrice + extras) * multiplier);
            
            const priceEl = document.getElementById('totalPrice');
            
            // Плавная анимация пульсации цифр
            priceEl.style.transform = 'scale(1.15)';
            priceEl.style.color = '#fff';
            priceEl.style.textShadow = '0 0 30px rgba(255, 255, 255, 0.8)';
            
            setTimeout(() => {
                // Форматируем с пробелами (напр. 2 500)
                priceEl.innerText = total.toLocaleString('ru-RU') + ' ₽';
                
                priceEl.style.transform = 'scale(1)';
                priceEl.style.color = 'var(--accent)';
                priceEl.style.textShadow = '0 0 20px var(--accent-glow)';
            }, 150);
        }
    </script>
</body>
</html>
